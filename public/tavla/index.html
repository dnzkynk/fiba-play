<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIBA Oyunları — Tavla</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #002A47; }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(135deg, #0066B3 0%, #003A63 55%, #3F7D23 100%);
    color: #EAF3FA; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .4s; text-align: center; padding: 24px;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .dice { font-size: 52px; animation: spin 1.6s ease-in-out infinite; }
  @keyframes spin { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg) scale(1.08); } }
  #msg { font-size: 17px; font-weight: 600; }
  #sub { font-size: 13px; color: #ADD0EB; max-width: 340px; line-height: 1.5; }
  #barwrap { width: 260px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.15); overflow: hidden; }
  #bar { height: 100%; width: 0%; border-radius: 999px; background: #7AC143; transition: width .2s; }
</style>
<script src="wasm_exec.js"></script>
</head>
<body>
<div id="overlay">
  <div class="dice">🎲</div>
  <div id="msg">Oyun yükleniyor…</div>
  <div id="barwrap"><div id="bar"></div></div>
  <div id="sub">Maçın hazırlanıyor — sayfa kendiliğinden oyuna geçecek, hiçbir şeye tıklamana gerek yok.</div>
</div>
<script>
  // ?debug=1: oyunun WebSocket trafiğini konsola döker (teşhis için)
  if (new URLSearchParams(location.search).has("debug")) {
    const OW = WebSocket;
    window.WebSocket = function (u, p) {
      console.warn("[WS-XRAY] new", u, p === undefined ? "(protokolsüz)" : JSON.stringify(p));
      const w = p === undefined ? new OW(u) : new OW(u, p);
      w.addEventListener("open", () => console.warn("[WS-XRAY] open"));
      w.addEventListener("error", () => console.warn("[WS-XRAY] error readyState=" + w.readyState));
      w.addEventListener("close", (e) => console.warn("[WS-XRAY] close", e.code, e.reason || "(sebepsiz)", "clean=" + e.wasClean));
      return w;
    };
    window.WebSocket.prototype = OW.prototype;
    Object.assign(window.WebSocket, { CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3 });
  }

  const msg = (t) => (document.getElementById("msg").textContent = t);
  const bar = (p) => (document.getElementById("bar").style.width = Math.min(100, p) + "%");
  const overlay = document.getElementById("overlay");

  // Oyun, oyuncu odaya oturduğunda bu fonksiyonu çağırır (boxcars FIBA yaması)
  window.fibaGameStarted = () => {
    msg("Maç başlıyor!");
    setTimeout(() => overlay.classList.add("hidden"), 300);
  };

  // Bağlantı denemeleri tükendiğinde: sessiz menüye düşmek yerine net hata + tekrar dene
  window.fibaConnectFailed = () => {
    msg("Bağlantı kurulamadı");
    document.getElementById("bar").style.background = "#f87171";
    const sub = document.getElementById("sub");
    sub.innerHTML = "Ağ bağlantısı oyun sunucusuna ulaşamadı. " +
      "<button onclick=\"location.reload()\" style=\"margin-top:10px;display:block;margin-inline:auto;" +
      "padding:8px 18px;border:0;border-radius:8px;background:#0066B3;color:#fff;font-size:14px;" +
      "font-weight:600;cursor:pointer\">Tekrar dene</button>";
  };

  (async () => {
    try {
      // WASM'ı ilerleme göstererek indir
      const resp = await fetch("boxcars.wasm");
      const total = +resp.headers.get("Content-Length") || 6000000;
      const reader = resp.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        bar((got / total) * 90); // %90'a kadar indirme
      }
      const buf = new Uint8Array(got);
      let off = 0;
      for (const c of chunks) { buf.set(c, off); off += c.length; }

      msg("Sunucuya bağlanılıyor…");
      bar(95);
      const go = new Go();
      const { instance } = await WebAssembly.instantiate(buf.buffer, go.importObject);
      msg("Odan hazırlanıyor…");
      bar(100);
      document.getElementById("sub").textContent =
        "Rakibin de bağlandığında oyun başlar. Bu birkaç saniye sürebilir.";

      // Emniyet: 45 sn içinde oda sinyali gelmezse perdeyi kaldır (elle devam edilebilsin)
      setTimeout(() => {
        if (!overlay.classList.contains("hidden")) overlay.classList.add("hidden");
      }, 75000);

      go.run(instance);
    } catch (err) {
      msg("Yükleme hatası");
      document.getElementById("sub").textContent =
        "Sayfayı yenileyip tekrar dene. Sorun sürerse organizasyona haber ver. (" + err + ")";
    }
  })();
</script>
</body>
</html>
