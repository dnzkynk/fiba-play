# Fiba Tournament — Hetzner prodüksiyon yığını
# Postgres (kalıcı veri) + portal (Next.js/watcher) + Caddy (reverse proxy, otomatik SSL)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fiba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fiba
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiba"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fiba:${POSTGRES_PASSWORD}@db:5432/fiba
      BASE_URL: ${BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      PASSWORD_SECRET: ${PASSWORD_SECRET}
      BGAMMON_WEBHOOK_SECRET: ${BGAMMON_WEBHOOK_SECRET}
      PORT: "3000"
      TZ: Europe/Istanbul
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  caddydata:
  caddyconfig:
